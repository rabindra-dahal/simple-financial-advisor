[pytest]
filterwarnings =
    # Ignore the private Union generic alias warning from python 3.17 deprecations
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    
    # Ignore internal asyncio deprecation warnings from chromadb telemetry
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning
    
    # Ignore insecure secret key warnings during localized mock test execution
    ignore:.*HMAC key is.*:UserWarning
